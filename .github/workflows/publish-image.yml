name: Publish Node.js Images

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH to publish all nine Node.js versions'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify confirmation and successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLISH"
          test "${GITHUB_REF_NAME}" = "master"
          result=$(gh api \
            "repos/${REPOSITORY}/actions/workflows/test-image.yml/runs?head_sha=${COMMIT_SHA}&per_page=30" \
            --jq '[.workflow_runs[] | select(.head_sha == env.COMMIT_SHA and .conclusion == "success")] | length')
          test "$result" -ge 1
          echo "Verified successful test workflow for ${COMMIT_SHA}"

  publish:
    needs: verify-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - node: 18
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 19
            distro: bullseye-slim
            lifecycle: legacy-insecure
          - node: 20
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 21
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 22
            distro: bookworm-slim
            lifecycle: supported
          - node: 23
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 24
            distro: bookworm-slim
            lifecycle: supported
          - node: 25
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 26
            distro: bookworm-slim
            lifecycle: supported

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ matrix.node }}
            NODE_DISTRO=${{ matrix.distro }}
          tags: ghcr.io/${{ github.repository }}:nodejs_${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Pterodactyl Node.js ${{ matrix.node }}
            dev.akaa.node.major=${{ matrix.node }}
            dev.akaa.node.lifecycle=${{ matrix.lifecycle }}
          provenance: true
          sbom: true
