name: Publish Node.js Images

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH to publish all nine Node.js versions'
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify confirmation and successful tests
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "PUBLISH"
          test "${GITHUB_REF_NAME}" = "master"
          result=$(gh api \
            "repos/${REPOSITORY}/actions/workflows/test-image.yml/runs?head_sha=${COMMIT_SHA}&per_page=30" \
            | jq --arg sha "$COMMIT_SHA" '
              [.workflow_runs[] |
                select(
                  .head_sha == $sha
                  and .head_branch == "master"
                  and .event == "push"
                  and .status == "completed"
                  and .conclusion == "success"
                )
              ] | length
            ')
          test "$result" -ge 1
          echo "Verified successful test workflow for ${COMMIT_SHA}"

  publish:
    needs: verify-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - node: 18
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 19
            distro: bullseye-slim
            lifecycle: legacy-insecure
          - node: 20
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 21
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 22
            distro: bookworm-slim
            lifecycle: supported
          - node: 23
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 24
            distro: bookworm-slim
            lifecycle: supported
          - node: 25
            distro: bookworm-slim
            lifecycle: legacy-insecure
          - node: 26
            distro: bookworm-slim
            lifecycle: supported

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve locked Node.js base
        id: base
        shell: bash
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          python3 - <<'PYSELECT'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("node-versions.json").read_text())
          entry = data[os.environ["NODE_MAJOR"]]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("version", "distro", "digest", "lifecycle"):
                  print(f"{key}={entry[key]}", file=output)
          PYSELECT
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NODE_VERSION=${{ steps.base.outputs.version }}
            NODE_DIGEST=${{ steps.base.outputs.digest }}
            NODE_DISTRO=${{ steps.base.outputs.distro }}
          tags: ghcr.io/${{ github.repository }}:nodejs_${{ matrix.node }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Pterodactyl Node.js ${{ matrix.node }}
            dev.akaa.node.major=${{ matrix.node }}
            dev.akaa.node.lifecycle=${{ steps.base.outputs.lifecycle }}
            dev.akaa.node.version=${{ steps.base.outputs.version }}
          provenance: true
          sbom: true
