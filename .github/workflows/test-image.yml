name: Test Node.js Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        node: [18, 19, 20, 21, 22, 23, 24, 25, 26]
        platform: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve locked Node.js base
        id: base
        shell: bash
        env:
          NODE_MAJOR: ${{ matrix.node }}
        run: |
          python3 - <<'PYSELECT'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("node-versions.json").read_text())
          entry = data[os.environ["NODE_MAJOR"]]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for key in ("version", "distro", "digest", "lifecycle"):
                  print(f"{key}={entry[key]}", file=output)
          PYSELECT
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.platform }}
          build-args: |
            NODE_VERSION=${{ steps.base.outputs.version }}
            NODE_DIGEST=${{ steps.base.outputs.digest }}
            NODE_DISTRO=${{ steps.base.outputs.distro }}
          tags: nodejs-test:${{ matrix.node }}
      - name: Verify runtime and architecture
        shell: bash
        run: |
          platform='linux/${{ matrix.platform }}'
          image='nodejs-test:${{ matrix.node }}'
          expected='${{ steps.base.outputs.version }}'
          version=$(docker run --rm --platform "$platform" "$image" 'node -p process.versions.node')
          test "$version" = "$expected"
          arch=$(docker run --rm --platform "$platform" -e STARTUP='node -p process.arch' "$image")
          if [ '${{ matrix.platform }}' = 'amd64' ]; then
            test "$arch" = 'x64'
          else
            test "$arch" = 'arm64'
          fi
          docker run --rm --platform "$platform" "$image" 'test "$(id -u)" = "1000"'
          docker run --rm --platform "$platform" "$image" 'test "$(pwd)" = "/home/container"'
          docker run --rm --platform "$platform" "$image" 'npm --version'
          docker run --rm --platform "$platform" "$image" 'python3 --version'
          docker run --rm --platform "$platform" "$image" 'gcc --version'
      - name: Verify npm installation
        shell: bash
        run: |
          docker run --rm --platform 'linux/${{ matrix.platform }}' 'nodejs-test:${{ matrix.node }}' 'mkdir -p /home/container/smoke && cd /home/container/smoke && npm init -y && npm install --ignore-scripts --no-audit --no-fund is-number@7.0.0 && node -p require.resolve\(\"is-number\"\)'
