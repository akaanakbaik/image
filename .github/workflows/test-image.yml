name: Test Node.js Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            NODE_VERSION=22
          tags: nodejs-test:22
      - name: Verify runtime
        run: |
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'node --version'
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'npm --version'
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'git --version'
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'python3 --version'
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'gcc --version'
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'test "$(id -u)" = "1000"'
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'test "$(pwd)" = "/home/container"'
      - name: Verify startup and architecture
        run: |
          result=$(docker run --rm --platform '${{ matrix.platform }}' -e STARTUP='node -p process.arch' nodejs-test:22)
          test "$result" = '${{ matrix.arch }}'
      - name: Verify npm installation
        run: |
          docker run --rm --platform '${{ matrix.platform }}' nodejs-test:22 'mkdir -p /home/container/smoke && cd /home/container/smoke && npm init -y && npm install --ignore-scripts --no-audit --no-fund is-number@7.0.0 && node -p require.resolve\(\"is-number\"\)'
