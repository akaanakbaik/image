name: Test Node.js Image

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Node.js 22
        run: docker build --build-arg NODE_VERSION=22 -t nodejs-test:22 .
      - name: Check runtime and tools
        run: |
          docker run --rm nodejs-test:22 'node --version'
          docker run --rm nodejs-test:22 'npm --version'
          docker run --rm nodejs-test:22 'git --version'
          docker run --rm nodejs-test:22 'python3 --version'
          docker run --rm nodejs-test:22 'gcc --version'
      - name: Check container identity
        run: |
          docker run --rm nodejs-test:22 'id'
          docker run --rm nodejs-test:22 'pwd'
      - name: Check startup
        run: |
          docker run --rm -e STARTUP='node -e "console.log(42)"' nodejs-test:22
